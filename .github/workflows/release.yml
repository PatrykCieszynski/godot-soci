name: Publish tested Godot SOCI addon

# Publishing NEVER builds anything: it promotes the installable artifact of a
# successful ci.yml push-to-main run with the exact commit SHA.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v0.4.1"
        required: true
        type: string
  push:
    tags: ['v*']

concurrency:
  group: godot-soci-publish
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Promote verified main artifact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate version and CI provenance
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${GITHUB_REF}" == "refs/heads/main" ]] || { echo "::error::Manual releases must run from main"; exit 1; }
            version="${REQUESTED_VERSION}"
          else
            [[ "${GITHUB_REF}" == refs/tags/v* ]] || { echo "::error::Not a version tag"; exit 1; }
            version="${GITHUB_REF_NAME}"
          fi

          [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || { echo "::error::Use vMAJOR.MINOR.PATCH"; exit 1; }
          if gh release view "${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release ${version} already exists"
            exit 1
          fi

          git fetch --no-tags origin main
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]] || { echo "::error::Main advanced since dispatch: restart after new CI finishes"; exit 1; }
            if git ls-remote --exit-code --tags origin "refs/tags/${version}" >/dev/null; then
              echo "::error::Version tag ${version} already exists"
              exit 1
            fi
          else
            # Only publish a tag for a commit that actually belongs to main.
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "::error::Tag commit is not on main"; exit 1; }
          fi

          # Verify exact source commit and a *successful push-to-main* run.
          # A green PR run (or a different commit's artifact) is not sufficient.
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&event=push&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .conclusion == "success" and .status == "completed")] | sort_by(.run_number) | last | .id // empty')"
          # The URL filters by SHA; we additionally verify the fetched run
          # metadata using jq --arg with the current exact GITHUB_SHA.
          if [[ -z "${run_id}" || "${run_id}" == "null" ]]; then
            echo "::error::No successful ci.yml push-to-main run for ${GITHUB_SHA}"
            exit 1
          fi
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          jq -e --arg sha "${GITHUB_SHA}" '.head_sha == $sha and .event == "push" and .head_branch == "main" and .conclusion == "success" and .status == "completed"' <<< "${metadata}" >/dev/null ||
            { echo "::error::Artifact provenance verification failed"; exit 1; }
          echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Promoting CI run ${run_id} for commit ${GITHUB_SHA}"

      - name: Download immutable artifact from exact CI run
        uses: actions/download-artifact@v6
        with:
          name: godot-soci-installable
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Publish release without rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          test -s dist/godot-soci-installable.zip
          sha256sum dist/godot-soci-installable.zip
          # Guard again in case main moved during the artifact download.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            git fetch --no-tags origin main
            [[ "$(git rev-parse origin/main)" == "${GITHUB_SHA}" ]] ||
              { echo "::error::Main advanced; cannot create release from old commit"; exit 1; }
          fi
          cp dist/godot-soci-installable.zip "dist/godot-soci-${VERSION}.zip"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            gh release create "${VERSION}" "dist/godot-soci-${VERSION}.zip" \
              --target "${GITHUB_SHA}" --generate-notes --prerelease --title "Godot SOCI ${VERSION}"
          else
            gh release create "${VERSION}" "dist/godot-soci-${VERSION}.zip" \
              --verify-tag --generate-notes --prerelease --title "Godot SOCI ${VERSION}"
          fi
